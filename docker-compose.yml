services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    environment:
      DATABASE_URL: file:/data/shift-maestro.db

    volumes:
      - shift_maestro_data:/data

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  shift_maestro_data: